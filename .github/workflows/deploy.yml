name: Deploy to cloudflare

on:
  push:
    branches:
      - cloud_version # Desencadena el flujo de trabajo cada vez que se hace push a la rama 'cloud_version'
  workflow_dispatch: # Permite ejecutar el flujo de trabajo manualmente desde la pestaña de Actions en GitHub
    inputs:
      forzar_pdf:
        description: "Regenerar los PDF aunque cv.js no haya cambiado"
        type: boolean
        default: true

permissions:
  contents: write # Permite escribir contenidos en el repositorio
  pages: write # Permite escribir páginas en GitHub Pages
  id-token: write # Permite escribir tokens de identificación

jobs:
  changes:
    runs-on: ubuntu-latest # Ejecuta este trabajo en un contenedor Ubuntu más reciente
    outputs:
      src: ${{ steps.changes.outputs.src }} # Salida para cambios en archivos fuente
      infra: ${{ steps.changes.outputs.infra }} # Salida para cambios en la infraestructura
    steps:
      - uses: actions/checkout@v6 # Clona el repositorio
      - uses: dorny/paths-filter@v3 # Filtra cambios en los archivos especificados
        id: changes
        with:
          base: cloud_version # Comparar con el último estado de cloud-test
          filters: |
            src:
              - 'src/cv_info/cv.js' # Archivos que se monitorizan para cambios
              - 'src/pages/en/cv.astro'
              - 'src/pages/es/cv.astro'

  # La suite completa corre en TODOS los push, no solo cuando cambia el CV:
  # así un build roto no llega a producción ni genera PDFs corruptos.
  ci:
    uses: ./.github/workflows/ci.yml

  generate-pdf:
    # Normalmente solo corre si cambiaron los archivos del CV. La válvula de escape
    # manual es necesaria porque si CI falla en el commit que toca cv.js, el arreglo
    # posterior ya no toca cv.js: sin ella los PDF se quedarían viejos para siempre.
    if: ${{ needs.changes.outputs.src == 'true' || (github.event_name == 'workflow_dispatch' && inputs.forzar_pdf) }}
    needs: [changes, ci] # No se regeneran PDFs si los tests fallan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROD: ${{ false }} # Los PDF se imprimen desde el preview local, no desde producción
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v4 # lee la versión del campo packageManager

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # astro 7 exige >= 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site with Astro
        run: pnpm run build

      # pnpm-workspace.yaml desactiva el postinstall de puppeteer
      - name: Install Chrome for Puppeteer
        run: pnpm exec puppeteer browsers install chrome

      # Desde Astro 7 el preview es un demonio: se arranca con --background
      # y se para con `astro preview stop` (antes: nohup + kill por puerto)
      - name: Start Astro preview server
        run: pnpm exec astro preview --background --host 127.0.0.1 --port 4321

      - name: Generate PDFs
        run: pnpm run GPDF

      - name: Stop Astro preview server
        if: always()
        run: pnpm exec astro preview stop

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }} # Utiliza el token de GitHub para autenticarse
        uses: stefanzweifel/git-auto-commit-action@v7 # Realiza commit y push de los cambios
        with:
          branch: cloud_version
          commit_message: Update PDFs # Mensaje del commit
